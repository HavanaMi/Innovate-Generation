<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your Cart – Innovate Generation</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* ====== Theme ====== */
  :root{
    --bg:#f5f6f8;
    --text:#111;
    --muted:#555;
    --panel:#ffffff;
    --panel-border:#e7e8eb;
    --thead:#f0f2f5;
    --accent:#0a7bdc;
    --accent-2:#075ea7;
    --btn-ghost:#eef1f5;
  }

  /* ====== Base ====== */
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
  }

  /* ====== Top Nav (as requested) ====== */
  nav{
    position:sticky; top:0; z-index:10;
    background:#1f1f1f;
    padding:12px 10px;
    text-align:center;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  nav a{
    color:#fff;
    margin:0 10px;
    text-decoration:none;
    font-weight:600;
  }
  nav a:hover{ color:#ffd95a; }
  .cart-pill{
    display:inline-block;
    min-width:18px;
    padding:2px 6px;
    border-radius:999px;
    background:#ffd95a;
    color:#000;
    font-size:.8rem;
    line-height:1;
    vertical-align:middle;
    margin-left:4px;
  }

  /* ====== Header / Footer ====== */
  header, footer{
    text-align:center;
    padding:28px 16px;
    background:#fff;
    border-block:1px solid var(--panel-border);
  }
  header h1{ margin:0 0 8px; }

  /* ====== Layout ====== */
  main{ max-width:1100px; margin:24px auto; padding:0 16px; }
  .card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:16px;
    box-shadow: 0 6px 18px rgba(0,0,0,.06);
  }

  /* ====== Table ====== */
  table{ width:100%; border-collapse:collapse; }
  thead th{
    background:var(--thead);
    border-bottom:1px solid var(--panel-border);
    padding:12px 10px;
    text-align:left;
    text-transform:uppercase;
    font-size:.85rem;
    letter-spacing:.02em;
  }
  tbody td{
    padding:14px 10px;
    border-bottom:1px solid var(--panel-border);
    vertical-align:middle;
  }
  tbody tr:hover{ background:#fafbfc; }

  td img{
    width:70px; height:70px; object-fit:cover; border-radius:10px;
    border:1px solid var(--panel-border);
    background:#fff;
  }
  .item-title{ font-weight:700; }
  .item-sub{ color:var(--muted); font-size:.92rem; }

  .right{text-align:right;}

  /* ====== Qty controls ====== */
  .qty{ display:flex; align-items:center; gap:6px; }
  .qty button{
    width:30px; height:30px; border:none; border-radius:8px;
    background:var(--btn-ghost); color:var(--text);
    cursor:pointer; font-size:1rem;
  }
  .qty button:active{ transform:translateY(1px); }
  .qty input{
    width:48px; text-align:center;
    border:1px solid var(--panel-border);
    border-radius:8px;
    background:#fff; color:var(--text);
    padding:6px 4px;
  }

  /* ====== Buttons ====== */
  .actions{ display:flex; gap:10px; justify-content:flex-end; }
  .btn{
    border:none; border-radius:10px; padding:12px 16px;
    background:var(--accent); color:#fff; font-weight:700; cursor:pointer;
  }
  .btn:hover{ background:var(--accent-2); }
  .ghost{
    border:1px solid var(--panel-border);
    background:#fff; color:var(--text);
    border-radius:10px; padding:12px 16px; cursor:pointer;
  }
  .ghost.alt{ background:var(--btn-ghost); }

  /* ====== Totals ====== */
  .totals{
    display:flex; justify-content:flex-end; margin-top:14px;
  }
  .totals-box{
    min-width:280px;
    padding:14px;
    border:1px solid var(--panel-border);
    border-radius:12px;
    background:#fff;
  }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .muted{ color:var(--muted); }

  /* Empty state */
  .empty{ text-align:center; padding:30px 10px; color:var(--muted); }
  .empty a{ text-decoration:none; }
</style>
</head>
<body>

<!-- ====== NAV (full menu) ====== -->
<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="portfolio.html">Portfolio</a>
  <a href="articles.html">Articles</a>
  <a href="shop.html">Shop</a>
  <a href="resources.html">Resources</a>
  <a href="contact.html">Contact</a>
  <a href="policy.html">Policy</a>
  <a href="cart.html" aria-label="Cart">🛒 Cart <span id="cart-count" class="cart-pill">0</span></a>
</nav>

<header>
  <h1>Your Cart</h1>
  <p>Review your items and proceed to secure payment.</p>
</header>

<main>
  <div class="card">
    <div id="cart-root"></div>
  </div>
  <p class="muted" style="margin-top:8px;">* Shipping is added at checkout in Stripe.</p>
</main>

<footer><p>&copy; 2025 Innovate Generation.</p></footer>

<script>
/* ====== Simple cart store ====== */
const CART_KEY = 'ig_cart_v1';
const getCart = () => JSON.parse(localStorage.getItem(CART_KEY) || '[]');
const setCart = (c) => localStorage.setItem(CART_KEY, JSON.stringify(c));

function currency(n){ return '£' + (Math.round(n*100)/100).toFixed(2); }

function updateCartCount(){
  const span = document.getElementById('cart-count');
  const cart = getCart();
  const count = cart.reduce((a,i)=>a + (i.qty||1), 0);
  if(span) span.textContent = count;
}

function render(){
  const root = document.getElementById('cart-root');
  const cart = getCart();
  updateCartCount();

  if(cart.length === 0){
    root.innerHTML = `
      <div class="empty">
        <p>Your cart is empty.</p>
        <p><a href="shop.html" class="btn">Go to Shop</a></p>
      </div>`;
    return;
  }

  let subtotal = 0;
  cart.forEach(i => subtotal += (i.price || 0) * (i.qty || 1));

  root.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Price</th>
          <th>Qty</th>
          <th class="right">Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${cart.map((i,idx)=>`
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:14px;">
                <img src="${i.image}" alt="${i.name}">
                <div>
                  <div class="item-title">${i.name}</div>
                  <div class="item-sub">${i.description || i.id || ''}</div>
                </div>
              </div>
            </td>
            <td>${currency(i.price)}</td>
            <td class="qty">
              <button data-act="dec" data-idx="${idx}" aria-label="Decrease quantity">−</button>
              <input data-idx="${idx}" type="number" min="1" max="99" value="${i.qty||1}" inputmode="numeric">
              <button data-act="inc" data-idx="${idx}" aria-label="Increase quantity">+</button>
            </td>
            <td class="right">${currency((i.price||0)*(i.qty||1))}</td>
            <td class="right"><button class="ghost alt" data-act="rm" data-idx="${idx}">Remove</button></td>
          </tr>`).join('')}
      </tbody>
    </table>

    <div class="totals">
      <div class="totals-box">
        <div class="row"><span>Subtotal</span><strong>${currency(subtotal)}</strong></div>
        <div class="row muted" style="margin-top:6px;"><span>Shipping</span><span>Added at checkout</span></div>
        <hr style="border:none;border-top:1px solid var(--panel-border); margin:10px 0;">
        <div class="row" style="font-size:1.1rem;"><span>Total (est.)</span><strong>${currency(subtotal)}</strong></div>
        <div class="actions" style="margin-top:14px;">
          <button class="ghost" onclick="window.location='shop.html'">Continue shopping</button>
          <button id="checkout" class="btn">Pay by card</button>
        </div>
      </div>
    </div>
  `;
}

/* ====== Events ====== */
document.addEventListener('input', (e)=>{
  if(e.target.matches('input[type="number"][data-idx]')){
    const idx = +e.target.dataset.idx;
    const cart = getCart();
    let v = parseInt(e.target.value,10);
    if(isNaN(v)||v<1) v=1;
    if(v>99) v=99;
    cart[idx].qty = v;
    setCart(cart);
    render();
  }
});

document.addEventListener('click', async (e)=>{
  const btn = e.target;

  if(btn.dataset.act==='inc' || btn.dataset.act==='dec'){
    const idx = +btn.dataset.idx;
    const cart = getCart();
    let q = cart[idx].qty || 1;
    q += (btn.dataset.act==='inc' ? 1 : -1);
    if(q<1) q=1;
    cart[idx].qty = q;
    setCart(cart);
    render();
  }

  if(btn.dataset.act==='rm'){
    const idx = +btn.dataset.idx;
    const cart = getCart();
    cart.splice(idx,1);
    setCart(cart);
    render();
  }

  if(btn.id==='checkout'){
    const cart = getCart();
    if(cart.length===0) return;

    btn.disabled=true; const old=btn.textContent; btn.textContent='Redirecting…';

    // Reduce to priceId & qty for backend/Stripe
    const items = cart.map(i=>({ priceId:i.priceId, qty:i.qty||1 }));

    try{
const API_BASE = "https://inno-gen-dusky.vercel.app";  // <- Twój adres projektu na Vercel
const res = await fetch(`${API_BASE}/api/create-checkout-session`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ items })
      });
      const data = await res.json();
      if(res.ok && data.url){
        window.location = data.url; // do not clear cart yet
      }else{
        alert(data.error || 'Checkout error');
        btn.disabled=false; btn.textContent=old;
      }
    }catch(err){
      console.error(err);
      alert('Network error.');
      btn.disabled=false; btn.textContent=old;
    }
  }
});

render();
</script>
</body>
</html>
