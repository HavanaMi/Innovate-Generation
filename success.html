<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank you – Innovate Generation</title>
  <style>
    :root { --bg:#111; --text:#fff; --muted:#bfc6ce; --accent:#7cc3ff; }
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial}
    header,footer{background:#1a1a1a;text-align:center;padding:28px 16px}
    main{max-width:800px;margin:60px auto;padding:0 16px;text-align:center}
    a{color:var(--accent);text-decoration:none;font-weight:700}
    .card{background:#1f1f1f;border:1px solid #2a2a2a;border-radius:14px;padding:28px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
    .muted{color:var(--muted)}
    .btn{display:inline-block;margin-top:16px;background:#007acc;color:#fff;padding:12px 18px;border-radius:10px;font-weight:700}
  </style>
</head>
<body>
  <header><h1>Innovate Generation</h1></header>
  <main>
    <div class="card">
      <h2>Thank you for your order! 🎉</h2>
      <p class="muted">We’ve received your payment. A confirmation email will arrive shortly.</p>
      <a class="btn" href="shop.html">Back to shop</a>
    </div>
  </main>
  <footer><p>&copy; 2025 Innovate Generation.</p></footer>

  <!-- Wyczyszczenie koszyka po sukcesie -->
  <script>
    try { localStorage.removeItem('ig_cart_v2'); } catch(e){}
  </script>
</body>
</html>
